name: Ping URL Every 17 Minutes

on:
  schedule:
    # Run every 17 minutes (using cron syntax)
    - cron: '*/17 * * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  ping-url:
    runs-on: ubuntu-latest
    
    steps:
      - name: Ping URL
        run: curl -s -o /dev/null -w "%{http_code}" --max-time 10 https://motrix-ixyh.onrender.com/
